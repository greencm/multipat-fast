[package]
name = "sparrow-mpm"
version = "0.1.0"
edition = "2021"
description = "SPARROW: sparse-position, entropy-optimized SIMD multi-pattern matching with provable filter guarantees"
license = "MIT OR Apache-2.0"
repository = "https://github.com/greencm/perturb"

[lib]
name = "sparrow"
path = "src/lib.rs"

[dependencies]
regex-syntax = { version = "0.8", optional = true }
regex-automata = { version = "0.4", optional = true, default-features = false, features = ["std", "syntax", "meta", "nfa", "dfa", "hybrid", "perf"] }

[dev-dependencies]
aho-corasick = "1.1"
regex = "1"

[profile.release]
debug = true
lto = true
codegen-units = 1

[features]
# Regex literal prefilter: extract required literals from regexes with
# regex-syntax, match them with SPARROW, confirm with regex-automata.
prefilter = ["dep:regex-syntax", "dep:regex-automata"]
# Exhaustively enumerate every sampled-position subset instead of the pruned
# top-scoring candidate set. Slower builds, identical guarantees.
exhaustive-search = []

[[example]]
name = "regex_prefilter"
required-features = ["prefilter"]
